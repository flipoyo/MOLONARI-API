name: molonaviz2-tests

# Tests de l'espace molonaviz2/ (backend molonari-twin et frontend molonaviz2) dans la disposition de
# l'espace cgs MOLONARI1D :
#   Molonaviz/ (ce dépôt), pyheatmy/ (MOLONARI-computo, dépendance de test ../../pyheatmy)
#   et data/ (MOLONARI-data, mesures lues par les tests).
# Job backend : seulement le paquet molonari-twin, sans paquets système Qt ; PySide6 ne doit pas être
# installé. Il porte la suite rapide, la suite slow (calcul) et la ligne de commande.
# Job frontend : tout l'espace, sous Xvfb : sans serveur X, matplotlib refuse le backend QtAgg
# (« headless ») que choisit ui/plots/style.py. Le frontend n'a pas de tests slow.
on:
  push:
    branches: [CGS-MOLO]
    paths: ["molonaviz2/**", ".github/workflows/molonaviz2-tests.yml"]
  pull_request:
    paths: ["molonaviz2/**", ".github/workflows/molonaviz2-tests.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Molonaviz
      - uses: actions/checkout@v4
        with:
          repository: flipoyo/MOLONARI-computo
          ref: CGS-MOLO
          path: pyheatmy
      - uses: actions/checkout@v4
        with:
          repository: flipoyo/MOLONARI-data
          ref: CGS-MOLO
          path: data
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Installer le backend seul
        working-directory: Molonaviz/molonaviz2
        run: uv sync --frozen --package molonari-twin
      - name: PySide6 n'est pas installé
        working-directory: Molonaviz/molonaviz2
        run: |
          if uv run --frozen --package molonari-twin python -c "import PySide6"; then
            echo "PySide6 est installé avec le backend" >&2
            exit 1
          fi
      - name: Tests
        working-directory: Molonaviz/molonaviz2/backend
        run: uv run --frozen --package molonari-twin pytest
      - name: Tests longs (slow)
        working-directory: Molonaviz/molonaviz2/backend
        run: uv run --frozen --package molonari-twin pytest -m slow
      - name: Ligne de commande
        working-directory: Molonaviz/molonaviz2
        run: uv run --frozen --package molonari-twin molonari-twin validate examples/twins/twin_01

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Molonaviz
      - uses: actions/checkout@v4
        with:
          repository: flipoyo/MOLONARI-computo
          ref: CGS-MOLO
          path: pyheatmy
      - uses: actions/checkout@v4
        with:
          repository: flipoyo/MOLONARI-data
          ref: CGS-MOLO
          path: data
      - name: Paquets système pour Qt et serveur X virtuel
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libgl1 libdbus-1-3 libfontconfig1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Installer l'espace
        working-directory: Molonaviz/molonaviz2
        run: uv sync --frozen --all-packages
      - name: Tests
        working-directory: Molonaviz/molonaviz2/frontend
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a uv run --frozen pytest
