[project]
name = "molonari-api"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"
pytest = "*"
pyqt = "*"
pandas = "*"
scipy = "*"
matplotlib = "*"
setuptools = "*"

[pypi-dependencies]
molonaviz = { path = ".", editable = true }
grpcio-tools = ">=1.84.1, <2"

[tasks]
validate-molonaviz-structure = "cd src && python -c \"import molonaviz; print('Molonaviz structure validated')\""
run-server = "python -m src.receiver.main"