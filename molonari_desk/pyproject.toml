# Espace de travail uv de MOLONARI Desk : un seul uv.lock pour deux paquets.
#   backend/   molonari-twin : données, calcul (JAX, DREAM), twins et questions, sans Qt
#   frontend/  molonari-desk : application de bureau PySide6, qui n'appelle le backend que par sa façade
# La racine n'est pas un paquet : elle dépend des deux membres, pour qu'un `uv sync` ici installe tout.
[project]
name = "molonari-desk-workspace"
version = "0"
requires-python = ">=3.12,<3.14"
dependencies = ["molonari-twin", "molonari-desk"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pyheatmy",
    "bayesian_inversion",
]
package = [
    "pyinstaller>=6.10",
]

[tool.uv]
package = false
default-groups = ["dev", "package"]  # un simple `uv sync` garde PyInstaller

[tool.uv.workspace]
members = ["backend", "frontend"]

[tool.uv.sources]
molonari-twin = { workspace = true }
molonari-desk = { workspace = true }
# Références des tests du moteur, figées par commit (MOLONARI-computo séparé, plus monté dans l'espace cgs) :
# pyheatmy 0.12.0 (modèle direct) et bayesian_inversion 0.4.0 (énergie du MCMC).
pyheatmy = { git = "https://github.com/YunusEmre4418/MOLONARI-pyheatmy", rev = "401d8e1b48a40cf13efc74302fa9a1a8c67c665d" }
bayesian_inversion = { git = "https://github.com/YunusEmre4418/MOLONARI-bayesian-inversion", rev = "bb07a127acd893fd38b7c339fa561d941077408f" }
