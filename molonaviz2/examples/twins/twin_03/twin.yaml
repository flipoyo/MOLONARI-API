# Config figée d'un twin Molonaviz. Pour changer un paramètre, créez un nouveau twin.
schema: molonaviz-twin/1
name: twin_03
point: Point034
description: Point034, inversion courte (démo, expérimental)
mode: mcmc
data: {measurements: measurements.csv, start: '2016-06-27 13:00', end: '2016-07-12 10:15'}  # installation et retrait du dispositif exclus
sensors:
  depths: [0.1, 0.2, 0.3, 0.4]
  offset: 0
  sigma_temperature: 0.1
  sigma_pressure: 0.01
layers:
- {name: sédiments, z_low: 0.4}
numerics: {nb_cells: 50, initial_condition: linear}
mcmc:
  priors:
  - neg_log10_k: [11, 15]
    porosity: [0.01, 0.25]
    lambda_s: [1, 5]
    rhos_cs: [1000000, 10000000]
  nb_chains: 8
  nb_iter: 300
  burn_in_max: 300
  delta: 3
  n_cr: 3
  c: 0.1
  c_star: 1.0e-06
  gr_threshold: 1.2
  quantiles: [0.05, 0.5, 0.95]
  n_field_samples: 40
  space_step: 1
  time_step: 1
seed: 1
