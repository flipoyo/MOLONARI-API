# Config figée d'un twin Molonaviz. Pour changer un paramètre, créez un nouveau twin.
schema: molonaviz-twin/1
name: twin_04
point: Point034
description: Créé à partir de l'inversion du 2026-10-16 15:12
mode: mcmc
data: {measurements: measurements.csv}
sensors:
  depths: [0.1, 0.2, 0.3, 0.4]
  offset: 0
  sigma_temperature: 0.3
  sigma_pressure: 0.01
layers:
- {name: Couche 1, z_low: 0.4}
numerics: {nb_cells: 100, initial_condition: linear}
mcmc:
  priors:
  - neg_log10_k: [11, 15]
    porosity: [0.01, 0.25]
    lambda_s: [1, 5]
    rhos_cs: [1000000, 10000000]
  nb_chains: 10
  nb_iter: 1000
  burn_in_max: 1000
  delta: 3
  n_cr: 3
  c: 0.1
  c_star: 1.0e-06
  gr_threshold: 1.2
  quantiles: [0.05, 0.5, 0.95]
  n_field_samples: 200
  space_step: 1
  time_step: 1
seed: 0
