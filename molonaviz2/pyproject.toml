# Espace de travail uv de Molonaviz 2 : un seul uv.lock pour deux paquets.
#   backend/   molonari-twin : données, calcul (JAX, DREAM), twins et questions, sans Qt
#   frontend/  molonaviz2    : application de bureau PySide6, qui n'appelle le backend que par sa façade
# La racine n'est pas un paquet : elle dépend des deux membres, pour qu'un `uv sync` ici installe tout.
[project]
name = "molonaviz2-workspace"
version = "0"
requires-python = ">=3.12,<3.14"
dependencies = ["molonari-twin", "molonaviz2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pyheatmy",
]
package = [
    "pyinstaller>=6.10",
]

[tool.uv]
package = false
default-groups = ["dev", "package"]  # un simple `uv sync` garde PyInstaller

[tool.uv.workspace]
members = ["backend", "frontend"]

[tool.uv.sources]
molonari-twin = { workspace = true }
molonaviz2 = { workspace = true }
pyheatmy = { path = "../../pyheatmy", editable = true }
