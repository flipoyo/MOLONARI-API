[project]
name = "molonaviz2"
version = "0.1.0-alpha.2"
description = "Application de bureau pour l'inversion bayésienne des mesures MOLONARI (zone hyporhéique)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6>=6.7",
    "jax>=0.4.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyqtgraph>=0.13.7",
    "matplotlib>=3.9",
    "arviz>=1.3",
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "pyyaml>=6.0",
]

[project.scripts]
molonaviz2 = "molonaviz2.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pyheatmy",
]
package = [
    "pyinstaller>=6.10",
]

[tool.uv]
default-groups = ["dev", "package"]  # un simple `uv sync` garde PyInstaller

[tool.uv.sources]
pyheatmy = { path = "../../pyheatmy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molonaviz2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests longs (DREAM, comparaisons complètes avec pyheatmy)",
]
addopts = "-m 'not slow'"
qt_api = "pyside6"
