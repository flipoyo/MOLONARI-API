[project]
name = "molonaviz2"
version = "0.6.0"
description = "Application de bureau pour l'inversion bayésienne des mesures MOLONARI (zone hyporhéique)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "molonari-twin>=0.6.0,<0.7",
    "pyside6>=6.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyqtgraph>=0.13.7",
    "matplotlib>=3.9",
]

[project.scripts]
molonaviz2 = "molonaviz2.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]
package = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molonaviz2"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # pas de tests longs ici : ceux du calcul (marqueur slow) sont dans le backend
qt_api = "pyside6"
