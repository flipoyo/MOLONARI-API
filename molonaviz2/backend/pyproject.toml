[project]
name = "molonari-twin"
version = "0.7.0-alpha.1"
description = "Backend des twins MOLONARI : données, nettoyage, calcul (JAX, DREAM), twins et questions, sans interface."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "arviz>=1.3",
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# API HTTP locale (`molonari-twin serve`). Le serveur distant de la phase 5 ajoutera Celery et Redis.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
molonari-twin = "molonari_twin.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyheatmy",  # référence des tests du moteur (engine/reference.py)
    "fastapi>=0.115",  # tests de l'API (extra server)
    "uvicorn>=0.30",
    "httpx2>=2.16",  # TestClient de FastAPI (starlette 1.x)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molonari_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests longs (DREAM, comparaisons complètes avec pyheatmy)",
]
addopts = "-m 'not slow'"
